            description: One of 1, 3, 6, 9, 12.
          - name: link
            label: Button
            component: button
          - name: showGuideLink
            label: Show the package finder link
            type: boolean
          - name: id
            label: Anchor
            type: string
            hidden: true
          - name: background
            label: Background
            type: string
            hidden: true
          - name: width
            label: Width
            type: string
            hidden: true
      - name: process
        label: Process steps
        fields:
          - name: heading
            label: Heading
            component: line
            description: "Wrap words in *asterisks* to show them in the accent colour."
          - name: steps
            label: Steps
            type: object
            fields:
              - name: title
                label: Title
                component: line
              - name: text
                label: Text
                component: paragraph
            list:
              collapsible:
                collapsed: true
                summary: "{title.en}"
          - name: id
            label: Anchor
            type: string
            hidden: true
          - name: background
            label: Background
            type: string
            hidden: true
          - name: width
            label: Width
            type: string
            hidden: true
      - name: faq
        label: Questions & answers
        fields:
          - name: heading
            label: Heading
            component: line
            description: "Wrap words in *asterisks* to show them in the accent colour."
          - name: items
            label: Questions
            type: object
            fields:
              - name: question
                label: Question
                component: line
              - name: answer
                label: Answer
                component: paragraph
              - name: openByDefault
                label: Open by default
                type: boolean
            list:
              collapsible:
                collapsed: true
                summary: "{question.en}"
          - name: id
            label: Anchor
            type: string
            hidden: true
          - name: background
            label: Background
            type: string
            hidden: true
          - name: width
            label: Width
            type: string
            hidden: true
      - name: contact
        label: Contact & inquiry form
        fields:
          - name: heading
            label: Heading
            component: line
            description: "Wrap words in *asterisks* to show them in the accent colour."
          - name: intro
            label: Intro
            component: paragraph
          - name: service
            label: Service preselected in the form
            type: select
            options:
              values: [smm, seo, bundle, website, addon, other]
          - name: id
            label: Anchor
            type: string
            hidden: true
          - name: background
            label: Background
            type: string
            hidden: true
          - name: width
            label: Width
            type: string
            hidden: true
      - name: pricing
        label: Pricing tool
        fields:
          - name: heading
            label: Heading
            component: line
            description: "Wrap words in *asterisks* to show them in the accent colour."
          - name: defaultCategory
            label: Package group shown first
            type: select
            options:
              values: [smm, seo, bundle, website]
          - name: defaultDuration
            label: Contract length selected first (months)
            type: number
            description: One of 1, 3, 6, 9, 12.
          - name: lockCategory
            label: Show only this package group
            type: boolean
          - name: showAddons
            label: Show add-ons
            type: boolean
          - name: id
            label: Anchor
            type: string
            hidden: true
          - name: background
            label: Background
            type: string
            hidden: true
          - name: width
            label: Width
            type: string
            hidden: true
      - name: cta
        label: Call to action
        fields:
          - name: heading
            label: Heading
            component: line
            description: "Wrap words in *asterisks* to show them in the accent colour."
          - name: text
            label: Text
            component: paragraph
          - name: buttons
            label: Buttons
            component: button
            list:
              collapsible:
                collapsed: true
                summary: "{label.en}"
          - name: id
            label: Anchor
            type: string
            hidden: true
          - name: background
            label: Background
            type: string
            hidden: true
          - name: width
            label: Width
            type: string
            hidden: true
  line:
    type: object
    fields:
      - name: hy
        label: "Հայերեն"
        type: string
      - name: en
        label: English
        type: string
      - name: ru
        label: "Русский"
        type: string
  paragraph:
    type: object
    fields:
      - name: hy
        label: "Հայերեն"
        type: text
      - name: en
        label: English
        type: text
      - name: ru
        label: "Русский"
        type: text
  link:
    type: object
    fields:
      - name: label
        label: Label
        component: line
      - name: href
        label: "Link (e.g. pricing.html or #contact)"
        type: string
  button:
    type: object
    fields:
      - name: label
        label: Label
        component: line
      - name: href
        label: "Link (e.g. pricing.html or #contact)"
        type: string
      - name: style
        label: Style
        type: select
        options:
          values: [primary, secondary]
content:
  - name: pages
    label: Pages
    type: group
    items:
      - name: page-home
        label: Home
        type: file
        path: site/public/content/pages/home.json
        format: json
        fields:
          - name: meta
            label: Search engines & browser tab
            type: object
            fields:
              - name: title
                label: Page title
                component: line
              - name: description
                label: Description
                component: paragraph
          - name: sections
            label: Sections
            component: sections
      - name: page-services
        label: Services
        type: file
        path: site/public/content/pages/services.json
        format: json
        fields:
          - name: meta
            label: Search engines & browser tab
            type: object
            fields:
              - name: title
                label: Page title
                component: line
              - name: description
                label: Description
                component: paragraph
          - name: sections
            label: Sections
            component: sections
      - name: page-smm
        label: Social media (SMM)
        type: file
        path: site/public/content/pages/smm.json
        format: json
        fields:
          - name: meta
            label: Search engines & browser tab
            type: object
            fields:
              - name: title
                label: Page title
                component: line
              - name: description
                label: Description
                component: paragraph
          - name: sections
            label: Sections
            component: sections
      - name: page-seo
        label: SEO
        type: file
        path: site/public/content/pages/seo.json
        format: json
        fields:
          - name: meta
            label: Search engines & browser tab
            type: object
            fields:
              - name: title
                label: Page title
                component: line
              - name: description
                label: Description
                component: paragraph
          - name: sections
            label: Sections
            component: sections
      - name: page-website-creation
        label: Website creation
        type: file
        path: site/public/content/pages/website-creation.json
        format: json
        fields:
          - name: meta
            label: Search engines & browser tab
            type: object
            fields:
              - name: title
                label: Page title
                component: line
              - name: description
                label: Description
                component: paragraph
          - name: sections
            label: Sections
            component: sections
      - name: page-pricing
        label: Pricing
        type: file
        path: site/public/content/pages/pricing.json
        format: json
        fields:
          - name: meta
            label: Search engines & browser tab
            type: object
            fields:
              - name: title
                label: Page title
                component: line
              - name: description
                label: Description
                component: paragraph
          - name: sections
            label: Sections
            component: sections
      - name: page-about
        label: About
        type: file
        path: site/public/content/pages/about.json
        format: json
        fields:
          - name: meta
            label: Search engines & browser tab
            type: object
            fields:
              - name: title
                label: Page title
                component: line
              - name: description
                label: Description
                component: paragraph
          - name: sections
            label: Sections
            component: sections
      - name: page-contact
        label: Contact
        type: file
        path: site/public/content/pages/contact.json
        format: json
        fields:
          - name: meta
            label: Search engines & browser tab
            type: object
            fields:
              - name: title
                label: Page title
                component: line
              - name: description
                label: Description
                component: paragraph
          - name: sections
            label: Sections
            component: sections
  - name: catalog
    label: Packages & prices
    description: Prices in AMD. Leave a contract length empty if the package is not offered for it.
    type: file
    path: site/public/content/catalog.json
    format: json
    fields:
      - name: packages
        label: Packages
        type: object
        fields:
          - name: key
            label: Key
            type: string
            readonly: true
          - name: category
            label: Group
            type: select
            options:
              values: [smm, seo, bundle, website]
            readonly: true
          - name: name
            label: Name
            component: line
          - name: tagline
            label: Tagline
            component: line
          - name: recommended
            label: Recommended
            type: boolean
          - name: prices
            label: Monthly price by contract length
            type: object
            fields:
              - name: m1
                label: "1 month"
                type: number
              - name: m3
                label: "3 months"
                type: number
              - name: m6
                label: "6 months"
                type: number
              - name: m9
                label: "9 months"
                type: number
              - name: m12
                label: "12 months"
                type: number
          - name: oneTimePrice
            label: One-time price (website creation)
            type: number
          - name: components
            label: Combines (bundles)
            type: select
            options:
              values: [smm-start, smm-dominance, smm-gold, seo-fundamental, seo-vision, seo-authority, business-boost, ultra, website-creation]
              multiple: true
            readonly: true
          - name: contact
            label: Contact person
            type: select
            options:
              values: [mariam, edgar, either]
        list:
          collapsible:
            collapsed: true
            summary: "{name.en}"
      - name: addons
        label: Add-ons
        type: object
        fields:
          - name: key
            label: Key
            type: string
            readonly: true
          - name: name
            label: Name
            component: line
          - name: price
            label: Price
            type: number
          - name: priceIsFrom
            label: "Price is a minimum (\"from\")"
            type: boolean
          - name: units
            label: Items in the bundle
            type: number
          - name: contact
            label: Contact person
            type: select
            options:
              values: [mariam, edgar]
        list:
          collapsible:
            collapsed: true
            summary: "{name.en}"
  - name: finder
    label: Package finder
    type: file
    path: site/public/content/finder.json
    format: json
    fields:
      - name: questions
        label: Questions
        type: object
        fields:
          - name: key
            label: Key
            type: string
            readonly: true
          - name: role
            label: Role
            type: string
            readonly: true
          - name: label
            label: Question
            component: line
          - name: help
            label: Help text
            component: line
          - name: options
            label: Answers
            type: object
            fields:
              - name: value
                label: Value
                type: string
                readonly: true
              - name: label
                label: Answer
                component: line
              - name: budgetMax
                label: Budget limit (AMD)
                type: number
              - name: months
                label: Months
                type: number
            list:
              collapsible:
                collapsed: true
                summary: "{label.en}"
        list:
          collapsible:
            collapsed: true
            summary: "{label.en}"
      - name: rules
        label: Scoring rules
        type: object
        fields:
          - name: key
            label: Key
            type: string
            readonly: true
          - name: packageKey
            label: Package
            type: select
            options:
              values: [smm-start, smm-dominance, smm-gold, seo-fundamental, seo-vision, seo-authority, business-boost, ultra, website-creation]
          - name: points
            label: Points
            type: number
          - name: when
            label: When the answers are
            type: object
            fields:
              - name: question
                label: Question key
                type: string
              - name: values
                label: Answer values
                type: string
                list: true
            list: true
          - name: reason
            label: Reason shown to the visitor
            component: paragraph
        list:
          collapsible:
            collapsed: true
            summary: "{key}"
  - name: site
    label: Contact details
    type: file
    path: site/public/content/site.json
    format: json
    fields:
      - name: name
        label: Agency name
        component: line
      - name: titleSuffix
        label: Browser tab suffix
        component: line
      - name: description
        label: Default description
        component: paragraph
      - name: phoneDisplay
        label: Phone (as shown)
        type: string
      - name: phoneE164
        label: Phone (international, no spaces)
        type: string
        pattern: "^\\+[0-9]{8,15}$"
      - name: whatsapp
        label: WhatsApp number (digits only)
        type: string
        pattern: "^[0-9]{8,15}$"
      - name: email
        label: Public email
        type: string
      - name: formEmail
        label: Inquiry form sends to
        type: string
        description: Changing this needs a new FormSubmit activation (see site/README.md).
  - name: people
    label: Founders
    type: file
    path: site/public/content/people.json
    format: json
    fields:
      - name: people
        label: People
        type: object
        fields:
          - name: key
            label: Key
            type: string
            readonly: true
          - name: name
            label: Name
            component: line
          - name: role
            label: Role
            component: line
          - name: services
            label: Handles inquiries about
            type: select
            options:
              values: [smm, seo, bundle, website, addon, other]
              multiple: true
        list:
          collapsible:
            collapsed: true
            summary: "{name.en}"
  - name: navigation
    label: Menu & footer
    type: file
    path: site/public/content/navigation.json
    format: json
    fields:
      - name: header
        label: Menu links
        component: link
        list:
          collapsible:
            collapsed: true
            summary: "{label.en}"
      - name: cta
        label: Menu button
        component: button
      - name: footerStatement
        label: Footer statement
        component: line
        description: "Wrap words in *asterisks* to show them in the accent colour."
      - name: footerColumns
        label: Footer columns
        type: object
        fields:
          - name: title
            label: Title
            component: line
          - name: links
            label: Links
            component: link
            list:
              collapsible:
                collapsed: true
                summary: "{label.en}"
        list:
          collapsible:
            collapsed: true
            summary: "{title.en}"
      - name: footerNote
        label: Footer note
        component: paragraph
  - name: interface
    label: Buttons & labels
    description: "Short texts used across the site. {name}-style placeholders are filled in automatically: keep them."
    type: file
    path: site/public/content/ui.json
    format: json
