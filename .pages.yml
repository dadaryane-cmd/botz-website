# Generated from site/cms/config.js by `npm run cms` — edit that file, not this one.
media:
  - name: images
    label: Images
    input: site/public/images
    output: images
  - name: downloads
    label: Sample PDFs
    input: site/public/downloads
    output: downloads
    categories: [document]
components:
  sections:
    type: block
    blockKey: type
    list: true
    blocks:
      - name: hero
        label: Page title
        fields:
          - name: heading
            label: Heading
            component: line
            description: "Wrap words in *asterisks* to show them in the accent colour."
          - name: subheading
            label: Subheading
            component: paragraph
          - name: buttons
            label: Buttons
            component: button
            list:
              collapsible:
                collapsed: true
                summary: "{label.en}"
          - name: ticker
            label: Scrolling words (home page)
            component: line
            list: true
          - name: variant
            label: Variant
            type: string
            hidden: true
          - name: id
            label: Anchor
            type: string
            hidden: true
          - name: background
            label: Background
            type: string
            hidden: true
          - name: width
            label: Width
            type: string
            hidden: true
      - name: split
        label: Statement with key points
        fields:
          - name: statement
            label: Statement
            component: line
            description: "Wrap words in *asterisks* to show them in the accent colour."
          - name: body
            label: Text
            component: paragraph
          - name: points
            label: Key points
            type: object
            fields:
              - name: title
                label: Title
                component: line
              - name: text
                label: Text
                component: paragraph
            list:
              collapsible:
                collapsed: true
                summary: "{title.en}"
          - name: id
            label: Anchor
            type: string
            hidden: true
          - name: background
            label: Background
            type: string
            hidden: true
          - name: width
            label: Width
            type: string
            hidden: true
      - name: services
        label: Services
        fields:
          - name: heading
            label: Heading
            component: line
            description: "Wrap words in *asterisks* to show them in the accent colour."
          - name: items
            label: Services
            type: object
            fields:
              - name: index
                label: Number
                type: string
              - name: title
                label: Title
                component: line
              - name: highlights
                label: Highlights
                component: line
                list: true
              - name: link
                label: Link
                component: link
            list:
              collapsible:
                collapsed: true
                summary: "{title.en}"
          - name: id
            label: Anchor
            type: string
            hidden: true
          - name: background
            label: Background
            type: string
            hidden: true
          - name: width
            label: Width
            type: string
            hidden: true
      - name: team
        label: Team
        fields:
          - name: heading
            label: Heading
            component: line
            description: "Wrap words in *asterisks* to show them in the accent colour."
          - name: intro
            label: Intro
            component: paragraph
          - name: founders
            label: People
            type: object
            fields:
              - name: name
                label: Name
                component: line
              - name: role
                label: Role
                component: line
            list:
              collapsible:
                collapsed: true
                summary: "{name.en}"
          - name: id
            label: Anchor
            type: string
            hidden: true
          - name: background
            label: Background
            type: string
            hidden: true
          - name: width
            label: Width
            type: string
            hidden: true
      - name: samples
        label: Sample PDFs
        fields:
          - name: heading
            label: Heading
            component: line
            description: "Wrap words in *asterisks* to show them in the accent colour."
          - name: intro
            label: Intro
            component: paragraph
          - name: items
            label: Samples
            type: object
            fields:
              - name: title
                label: Title
                component: line
              - name: text
                label: Text
                component: paragraph
              - name: file
                label: PDF
                type: file
                options:
                  media: downloads
            list:
              collapsible:
                collapsed: true
                summary: "{title.en}"
          - name: id
            label: Anchor
            type: string
            hidden: true
          - name: background
            label: Background
            type: string
            hidden: true
          - name: width
            label: Width
            type: string
            hidden: true
      - name: finder
        label: Package finder
        fields:
          - name: heading
            label: Heading
            component: line
            description: "Wrap words in *asterisks* to show them in the accent colour."
          - name: intro
            label: Intro
            component: paragraph
          - name: id
            label: Anchor
            type: string
            hidden: true
          - name: background
            label: Background
            type: string
            hidden: true
          - name: width
            label: Width
            type: string
            hidden: true
      - name: packagePreview
        label: Price overview
        fields:
          - name: heading
            label: Heading
            component: line
            description: "Wrap words in *asterisks* to show them in the accent colour."
          - name: intro
            label: Intro
            component: paragraph
          - name: categories
            label: Package groups
            type: select
            options:
              values: [smm, seo, bundle, website]
              multiple: true
          - name: duration
            label: Contract length shown (months)
